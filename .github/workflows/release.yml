name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.1.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # NuGet trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The library multi-targets net10.0/net11.0, so both runtimes have to be
      # present for the test run; the 11.0.x SDK builds both.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # INPUT_VERSION goes through the environment, not a ${{ }} interpolation inside the
      # script: interpolation is substituted before the shell runs, so the validation
      # below could never see - let alone reject - an injected command.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid version (expected 1.2.3 or 1.2.3-preview.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - name: Restore
        run: dotnet restore AspNetCore.BasicAuthentication.sln

      - name: Build
        run: dotnet build AspNetCore.BasicAuthentication.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test AspNetCore.BasicAuthentication.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack BasicAuthGuard/BasicAuthGuard.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: BasicAuthGuard/nupkg/*.*nupkg

      # Trusted publishing: swaps the GitHub OIDC token for a NuGet API key that lives for 1 hour.
      # Needs a matching policy on nuget.org (owner TarasKovalenko, this repo, workflow release.yml).
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: TarasKovalenko

      # --skip-duplicate keeps a re-run from failing when a package version is already live.
      # The matching .snupkg is picked up automatically alongside each .nupkg.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "BasicAuthGuard/nupkg/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" BasicAuthGuard/nupkg/*.nupkg --generate-notes
